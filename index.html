<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tibia — Task or Sell?</title>
  <meta name="description"
        content="Compare NPC task rewards against market sell values to decide whether to complete a Tibia delivery task or sell your loot." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── Top bar ── -->
  <header class="topbar">
    <span class="topbar-logo">⚔️ Tibia Task-or-Sell</span>
    <span class="topbar-sub">Should you complete the task or sell the loot?</span>
  </header>

  <!-- ── Main layout ── -->
  <div class="layout">

    <!-- Left sidebar: task list -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <!-- Search -->
        <div class="search-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input id="search-input" type="search" placeholder="Search tasks or items…" autocomplete="off" />
        </div>
        <!-- NPC filter chips -->
        <div id="npc-filter"></div>
      </div>

      <!-- Task items -->
      <div id="task-list"></div>
    </aside>

    <!-- Right panel: task detail + calculator -->
    <main class="detail-outer">
      <div id="detail-panel">
        <!-- Placeholder shown before selecting a task -->
        <div class="placeholder">
          <div class="placeholder-icon">🎒</div>
          <h2>Pick a delivery task</h2>
          <p>
            Select a task from the left panel. Enter your item quantities
            and current market prices to instantly see whether completing
            the task or selling the items gives you more gold.
          </p>
        </div>
      </div>
    </main>

  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
